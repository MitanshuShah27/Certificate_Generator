<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<script>
Swal.fire({
  title: '✅ Certificate Created!',
  text: 'Certificate for {{ name }} has been saved in your Downloads folder.',
  icon: 'success',
  confirmButtonText: 'OK'
}).then(() => {
  window.location.href = "/";
});
</script>
</body>
</html>
