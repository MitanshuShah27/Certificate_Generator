<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Certificate</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <!-- Header -->
    <div class="text-center mb-4">
      <h1>Amee Computer Class, Vadodara</h1>
      <h2>Ajay Shah : 7600021127</h2>
      <p class="text-muted">Certificate Generator</p>
    </div>

    <!-- Form -->
    <form method="POST">
      <!-- Name input -->
      <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input type="text" class="form-control" id="name" name = "name"placeholder="Enter your name">
      </div>

      <!-- Gender radio buttons -->
      <div class="mb-3">
        <label class="form-label">Gender:</label><br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="male" value="1">
          <label class="form-check-label" for="male">Male</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="female" value="0">
          <label class="form-check-label" for="female">Female</label>
        </div>
      </div>

      <!-- First dropdown menu -->
      <div class="mb-3">
        <label for="dropdown1" class="form-label">Select Course</label>
        <select class="form-select" id="course" name="course">
          <option selected>Select a Course</option>
          <option value="C Programming">C Programming</option>
          <option value="C++ Programming">C++ Programming</option>
          <option value="JAVA Programming">JAVA Programming</option>
          <option value="Python Programming">Python Programming</option>
          <option value="Data Structures">Data Structures</option>
        </select>
      </div>

      <!-- Second dropdown menu with input box beside it -->
      <div class="mb-3 row align-items-center">
        <div class="col-md-6">
          <label for="dropdown2" class="form-label">Duration : From</label>
          <select class="form-select" id="df" name = "df">
            <option selected>Select month</option>
            <option value="January">January</option>
            <option value="February">February</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
            <option value="July">July</option>
            <option value="August">August</option>
            <option value="September">September</option>
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="extraInput" class="form-label">Year : From</label>
          <input type="text" class="form-control" id="year_from" name="year_from" placeholder="Year">
        </div>
        <div class="mb-3 row align-items-center">
        <div class="col-md-6">
          <label for="dropdown3" class="form-label">Duration : To</label>
          <select class="form-select" id="dt" name="dt">
            <option selected>Select month</option>
            <option value="January">January</option>
            <option value="February">February</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
            <option value="July">July</option>
            <option value="August">August</option>
            <option value="September">September</option>
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="extraInput" class="form-label">Year : To</label>
          <input type="text" class="form-control" id="year_to" name="year_to" placeholder="Year">
        </div>
      </div>

      <!-- Submit button -->
      <div class="text-center">
        <button type="submit" class="btn btn-primary">Generate</button>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
